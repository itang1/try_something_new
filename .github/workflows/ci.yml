# Lints, typechecks and tests every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # react-dom, pulled in by Expo's web tooling, asks for a newer React than React Native pins.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      # Checks the Expo config, native module versions against the SDK, and React Native Directory metadata.
      - run: npx expo-doctor
