<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try Something New Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, summary strip, then Waiting on you, then Up next as a numbered queue, then status lists, then horizons. Colors from the app's Dusk Ember theme. */
:root {
  --bg: #FCF5F4; --card: #FFFFFF; --ink: #23151A; --muted: #6E5A5E; --line: #EADCDD;
  --accent: #B8274A; --accent-soft: #F8E3E8; --done: #1E8048; --done-soft: #E2F2E8;
  --warn: #9A5B00; --warn-soft: #FBEFD9; --ask: #5B47D1; --ask-soft: #ECE9FB;
  --display: "Fraunces", Georgia, serif; --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1013; --card: #2B1D21; --ink: #F8EEEF; --muted: #B8A4A8; --line: #3E2C31;
    --accent: #FF8A8A; --accent-soft: #3D2026; --done: #4CD488; --done-soft: #183225;
    --warn: #F3B35C; --warn-soft: #3A2A14; --ask: #A99BFF; --ask-soft: #2A2547; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1013; --card: #2B1D21; --ink: #F8EEEF; --muted: #B8A4A8; --line: #3E2C31;
  --accent: #FF8A8A; --accent-soft: #3D2026; --done: #4CD488; --done-soft: #183225;
  --warn: #F3B35C; --warn-soft: #3A2A14; --ask: #A99BFF; --ask-soft: #2A2547; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
main { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; display: grid; gap: 28px; }
h1, h2 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 20px; display: flex; align-items: baseline; gap: 8px; }
h2 .n { font: 500 13px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
header { display: grid; gap: 8px; }
.meta { color: var(--muted); font-size: 13px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.strip a { text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.strip a b { font-weight: 600; }
.strip a:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section { display: grid; gap: 10px; }
ol.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: q; }
ol.queue li { counter-increment: q; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 52px; position: relative; }
ol.queue li::before { content: counter(q); position: absolute; left: 14px; top: 11px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 14px/26px var(--body); text-align: center; }
ol.queue li:first-child { border-color: var(--accent); }
ol.queue li:first-child::before { background: var(--accent); color: var(--bg); }
ul.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
ul.items li { background: var(--card); padding: 10px 14px; }
.title { font-weight: 600; }
.desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
.tags { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: 6px; vertical-align: 1px; }
.chip { font-size: 11px; font-weight: 500; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.wip { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.ask { background: var(--ask-soft); color: var(--ask); border-color: transparent; }
.chip.you { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.ok { background: var(--done-soft); color: var(--done); border-color: transparent; }
code { font-size: 12.5px; background: var(--accent-soft); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; }
a { color: var(--accent); }
details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
details > summary { cursor: pointer; padding: 12px 14px; font: 600 16px var(--display); list-style-position: inside; }
details > summary .n { font: 500 13px var(--body); color: var(--muted); margin-left: 6px; }
details > .body { padding: 0 14px 14px; }
details ul.items { border-radius: 8px; }
.empty { color: var(--muted); font-style: italic; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const MD = __ROADMAP_JSON__;
const BUILT = __BUILT_JSON__;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}

// Split into ## sections.
const sections = {}; let title = "", cur = null, intro = [];
for (const line of MD.split("\n")) {
  if (line.startsWith("# ")) { title = line.slice(2); continue; }
  if (line.startsWith("## ")) { cur = line.slice(3).trim(); sections[cur] = []; continue; }
  (cur ? sections[cur] : intro).push(line);
}
const find = prefix => Object.keys(sections).find(k => k.toLowerCase().startsWith(prefix.toLowerCase()));
const refreshed = (intro.join(" ").match(/Last refreshed ([0-9-]+)/) || [])[1] || "";

// An item line: "- [~] **Title** · Area · Size. Description"  or  "1. [ ] ...".
const ITEM = /^\s*(?:[-*]|\d+\.)\s+\[( |x|~|\?)\]\s+\*\*(.+?)\*\*\s*(.*)$/;
function parseItems(lines) {
  const out = []; let group = "";
  for (const line of lines) {
    const g = line.match(/^\*\*(.+?)\*\*\s*(.*)$/);
    if (g && !line.startsWith("- ")) { group = g[1]; continue; }
    const m = line.match(ITEM);
    if (!m) continue;
    let rest = m[3].replace(/^·\s*/, "");
    const parts = rest.split(/\s+·\s+/);
    let area = "", size = "", desc = rest;
    if (parts.length >= 2) {
      area = parts[0].trim();
      const sm = parts[1].match(/^(XL|S|M|L)\.\s*(.*)$/);
      if (sm) { size = sm[1]; desc = sm[2] + (parts.length > 2 ? " · " + parts.slice(2).join(" · ") : ""); }
      else desc = parts.slice(1).join(" · ");
    } else {
      const am = rest.match(/^([A-Z][a-z]+)\.\s*(.*)$/);
      if (am) { area = am[1]; desc = am[2]; }
    }
    out.push({ mark: m[1], title: m[2], area, size, desc: desc.trim(), group });
  }
  return out;
}
const SIZE = { S: "about a day", M: "2 to 5 days", L: "1 to 3 weeks", XL: "over 3 weeks" };
const needsYou = it => /needs (you|your)/i.test(it.desc);
function chips(it, opts = {}) {
  const c = [];
  if (it.mark === "~") c.push('<span class="chip wip">In progress</span>');
  if (it.mark === "?") c.push('<span class="chip ask">Needs a decision</span>');
  if (it.mark === "x" && !opts.hideDone) c.push('<span class="chip ok">Done</span>');
  if (needsYou(it)) c.push('<span class="chip you">Needs you</span>');
  if (it.area) c.push('<span class="chip">' + esc(it.area) + "</span>");
  if (it.size) c.push('<span class="chip" title="' + SIZE[it.size] + '">' + it.size + "</span>");
  return '<span class="tags">' + c.join("") + "</span>";
}
const isPointer = it => /^see up next\.?$/i.test(it.desc);
const itemHTML = (it, opts) => '<div><span class="title">' + inline(it.title) + "</span>" + chips(it, opts) + "</div>" +
  (it.desc && !isPointer(it) ? '<div class="desc">' + inline(it.desc) + "</div>" : "");
const list = (items, opts) => items.length ? '<ul class="items">' + items.map(it => "<li>" + itemHTML(it, opts) + "</li>").join("") + "</ul>" : '<p class="empty">Nothing here right now.</p>';

const upKey = find("Up next"), nowKey = find("Now"), nextKey = find("Next"), laterKey = find("Later"), inboxKey = find("Inbox"), doneKey = find("Done");
const up = upKey ? parseItems(sections[upKey]).filter(i => i.mark !== "x") : [];
const horizons = [[nowKey, true], [nextKey, false], [laterKey, false]].filter(h => h[0]).map(([k, open]) => ({ name: k, open, items: parseItems(sections[k]) }));
const done = doneKey ? parseItems(sections[doneKey]) : [];
const inbox = inboxKey ? sections[inboxKey].filter(l => /^\s*-\s+/.test(l)).map(l => l.replace(/^\s*-\s+/, "")) : [];

// Every open item once, preferring the copy with a real description.
const all = new Map();
for (const it of [...up, ...horizons.flatMap(h => h.items)]) {
  const prev = all.get(it.title);
  if (!prev || (isPointer(prev) && !isPointer(it))) all.set(it.title, it);
}
const upTitles = new Set(up.map(i => i.title));
const wip = [...all.values()].filter(i => i.mark === "~" && !upTitles.has(i.title));
// Waiting on you: every open item that needs a decision, an account, a device or anything else only you can do.
// Up next first, then Now, Next and Later, in the file's order.
const waiting = [...all.values()].filter(i => i.mark === "?" || needsYou(i));

const fmtDate = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }); };

let h = "<header><h1>" + inline(title || "Roadmap") + "</h1>";
h += '<div class="meta">Roadmap last refreshed ' + esc(fmtDate(refreshed)) + " · page rebuilt from <code>ROADMAP.md</code> on <code>main</code> " + esc(fmtDate(BUILT.date)) + (BUILT.commit ? " at <code>" + esc(BUILT.commit) + "</code>" : "") + "</div>";
h += '<nav class="strip" aria-label="Sections">' +
  '<a href="#up-next"><b>' + up.length + "</b> up next</a>" +
  '<a href="#in-progress"><b>' + wip.length + "</b> in progress</a>" +
  '<a href="#waiting"><b>' + waiting.length + "</b> waiting on you</a>" +
  '<a href="#inbox"><b>' + inbox.length + "</b> in the inbox</a>" +
  '<a href="#done"><b>' + done.length + "</b> done</a></nav></header>";

h += '<section id="waiting"><h2>Waiting on you <span class="n">' + waiting.length + "</span></h2>" +
  (waiting.length ? list(waiting) : '<p class="empty">Nothing is waiting on you right now.</p>') + "</section>";

h += '<section id="up-next"><h2>Up next <span class="n">in order</span></h2>';
h += up.length ? '<ol class="queue">' + up.map(it => "<li>" + itemHTML(it) + "</li>").join("") + "</ol>" : '<p class="empty">Up next is empty. Pull items in from Now.</p>';
h += "</section>";

h += '<section id="in-progress"><h2>In progress <span class="n">' + wip.length + "</span></h2>" + list(wip) + "</section>";
h += '<section id="inbox"><h2>Inbox <span class="n">unsorted ideas</span></h2>' +
  (inbox.length ? '<ul class="items">' + inbox.map(t => '<li><div class="desc" style="color:var(--ink)">' + inline(t) + "</div></li>").join("") + "</ul>" : '<p class="empty">Inbox is empty.</p>') + "</section>";

h += '<section id="horizons"><h2>Everything else</h2>';
for (const hz of horizons) {
  const open = hz.items.filter(i => i.mark !== "x");
  const groups = [];
  for (const it of open) { let g = groups.find(x => x.name === it.group); if (!g) groups.push(g = { name: it.group, items: [] }); g.items.push(it); }
  h += "<details" + (hz.open ? " open" : "") + "><summary>" + inline(hz.name) + '<span class="n">' + open.length + " open</span></summary><div class=\"body\">" +
    groups.map(g => (g.name ? "<h3>" + inline(g.name) + "</h3>" : "") + list(g.items)).join("") + "</div></details>";
}
h += "</section>";

h += '<section id="done"><details><summary>Done<span class="n">' + done.length + " shipped</span></summary><div class=\"body\">" + list(done, { hideDone: true }) + "</div></details></section>";
h += '<footer>Source: <a href="https://github.com/itang1/try_something_new/blob/main/ROADMAP.md" target="_blank" rel="noopener">ROADMAP.md on GitHub</a>. Sizes: S about a day, M 2 to 5 days, L 1 to 3 weeks, XL over 3 weeks. Any thread whose merged PR changes ROADMAP.md republishes this page.</footer>';

document.getElementById("app").innerHTML = h;
</script>
</body>
</html>
